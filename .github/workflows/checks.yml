name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: incidentlens
          POSTGRES_USER: incidentlens
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DATABASE_ENGINE: ${{ matrix.database }}
      POSTGRES_DB: incidentlens
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: ci-only-test-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  container-demo:
    runs-on: ubuntu-latest
    env:
      WALKTHROUGH_USERNAME: ci-review
      WALKTHROUGH_PASSWORD: ci-only-disposable-demo-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/setup_local.py
      - run: docker compose build
      - run: docker compose up -d --wait db
      - run: docker compose run --rm backend python manage.py migrate --noinput
      - run: >-
          docker compose run --rm -e WALKTHROUGH_PASSWORD backend python manage.py createuser
          --username ci-review --password-env WALKTHROUGH_PASSWORD
      - run: docker compose up -d --wait backend demo dashboard
      - run: uv run python scripts/demo_walkthrough.py --docker
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose --profile monitoring down
