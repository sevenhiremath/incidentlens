services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup_local.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup_local.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: db
      DJANGO_DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
  monitor:
    build: .
    env_file: .env
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: db
    command: ["python", "manage.py", "monitor"]
    profiles: ["monitoring"]
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: .
    environment:
      INCIDENTLENS_API_URL: http://backend:8000/api
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      - backend
  demo:
    build: .
    env_file: .env
    environment:
      INCIDENTLENS_API_URL: http://backend:8000/api
    command: ["python", "-m", "flask", "--app", "demo.app", "run", "--host=0.0.0.0", "--port=5055"]
    ports:
      - "127.0.0.1:5055:5055"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
